[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neutro-cerebro"
version = "0.1.0"
description = "Neutro: un cerebro de neuronas de concepto para agentes que aprenden solos de lo que sienten. Sin dependencias."
license = { text = "Apache-2.0" }
authors = [{ name = "FOKO SOFT (Emilio Martinez)" }]
requires-python = ">=3.9"
keywords = ["ai", "agent", "learning", "neuroscience", "concept-cells", "homeostasis", "games"]

[project.urls]
Repository = "https://github.com/emicaim/PUBLIC-NEUTRO"

[tool.setuptools]
packages = ["neutro"]
